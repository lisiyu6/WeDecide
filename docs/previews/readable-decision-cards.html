<div id="wd-readable-preview" class="viz-dotted-background">
<style>
#wd-readable-preview{color-scheme:light dark;--wd-bg:light-dark(#f6f5ef,#18201e);--wd-panel:light-dark(#fffef9,#232d29);--wd-text:light-dark(#263e38,#eef4ef);--wd-muted:light-dark(#596e64,#c0cfc5);--wd-line:light-dark(#d9e0d6,#415249);--wd-green:light-dark(#245e4b,#bbdbc7);--wd-on-green:light-dark(#ffffff,#17372a);--wd-soft:light-dark(#eaf0e7,#314437);font:400 16px/1.65 system-ui,sans-serif;color:var(--wd-text);padding:16px 8px}
#wd-readable-preview *{box-sizing:border-box}
#wd-readable-preview [hidden]{display:none!important}
#wd-readable-preview .wd-shell{max-width:720px;margin:auto;background:var(--wd-bg);border:1px solid var(--wd-line);border-radius:24px;padding:24px;overflow:hidden}
#wd-readable-preview h2{font-size:24px;line-height:1.4;margin:12px 0;font-weight:600}
#wd-readable-preview p{margin:10px 0}
#wd-readable-preview .wd-top,#wd-readable-preview .wd-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#wd-readable-preview .wd-top{padding-right:74px}
#wd-readable-preview .wd-wordmark{font-weight:650;letter-spacing:-.5px}
#wd-readable-preview .wd-small{font-size:14px;color:var(--wd-muted)}
#wd-readable-preview .wd-nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
#wd-readable-preview button{font:inherit;color:var(--wd-text);background:var(--wd-panel);border:1px solid var(--wd-line);border-radius:12px;padding:10px 15px;min-height:44px;cursor:pointer;white-space:normal}
#wd-readable-preview button[aria-selected=true],#wd-readable-preview .wd-primary{background:var(--wd-green);color:var(--wd-on-green);border-color:var(--wd-green)}
#wd-readable-preview button:disabled{opacity:.5;cursor:default}
#wd-readable-preview .wd-badge{display:inline-block;color:var(--wd-green);background:var(--wd-soft);border-radius:7px;padding:3px 9px;font-size:13px}
#wd-readable-preview .wd-deck{position:relative;margin:26px 8px 18px}
#wd-readable-preview .wd-deck:before,#wd-readable-preview .wd-deck:after{content:'';position:absolute;inset:10px 9px -9px;background:var(--wd-panel);border:1px solid var(--wd-line);border-radius:22px;transform:rotate(-2deg);pointer-events:none}
#wd-readable-preview .wd-deck:after{inset:5px 4px -4px;transform:rotate(1deg)}
#wd-readable-preview .wd-card{position:relative;z-index:1;background:var(--wd-panel);border:1px solid var(--wd-line);border-radius:22px;padding:24px;transform-origin:50% 100%;touch-action:pan-y;user-select:none;transition:transform .2s ease}
#wd-readable-preview .wd-card.wd-dragging{transition:none;cursor:grabbing}
#wd-readable-preview .wd-stamp{position:absolute;top:16px;right:16px;max-width:75%;color:var(--wd-green);background:var(--wd-panel);border:2px solid var(--wd-green);border-radius:8px;padding:3px 10px;transform:rotate(8deg);opacity:0;pointer-events:none}
#wd-readable-preview .wd-symbol{display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:50%;background:var(--wd-soft);color:var(--wd-green);font-size:28px;margin:18px 0}
#wd-readable-preview .wd-answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
#wd-readable-preview .wd-actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
#wd-readable-preview .wd-progress{height:5px;background:var(--wd-line);border-radius:4px;margin:12px 0;overflow:hidden}
#wd-readable-preview .wd-progress>span{display:block;height:100%;background:var(--wd-green);transition:width .2s ease}
#wd-readable-preview input,#wd-readable-preview select,#wd-readable-preview textarea{font:inherit;min-width:0;max-width:100%;width:100%;background:var(--wd-panel);color:var(--wd-text);border:1px solid var(--wd-line);border-radius:9px;padding:10px}
#wd-readable-preview input[type=checkbox]{width:20px;height:20px;flex:none}
#wd-readable-preview .wd-check{display:flex;align-items:flex-start;gap:10px;min-height:44px}
#wd-readable-preview .wd-note{padding:14px 16px;background:var(--wd-soft);border-radius:12px;margin:16px 0}
#wd-readable-preview .wd-table{width:100%;border-collapse:collapse;table-layout:fixed;margin:20px 0}
#wd-readable-preview .wd-table th,#wd-readable-preview .wd-table td{padding:12px 7px;text-align:left;vertical-align:top;border-bottom:1px solid var(--wd-line);overflow-wrap:anywhere}
#wd-readable-preview .wd-table th:first-child{width:20%}
#wd-readable-preview .wd-table th:nth-child(2){width:49%}
#wd-readable-preview .wd-table th{font-weight:500}
#wd-readable-preview .wd-use{display:block;margin-top:4px;color:var(--wd-muted);font-size:13px}
#wd-readable-preview .wd-result{color:var(--wd-green);min-height:26px;margin:12px 0}
@media(max-width:560px){#wd-readable-preview{padding:4px 0}#wd-readable-preview .wd-shell{padding:16px;border-radius:18px}#wd-readable-preview .wd-top{padding-right:0}#wd-readable-preview .wd-card{padding:18px}#wd-readable-preview .wd-deck{margin:22px 2px 18px}#wd-readable-preview h2{font-size:22px}#wd-readable-preview .wd-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#wd-readable-preview .wd-table tbody,#wd-readable-preview .wd-table tr,#wd-readable-preview .wd-table td{display:block;width:100%}#wd-readable-preview .wd-table tr{padding:12px 0;border-bottom:1px solid var(--wd-line)}#wd-readable-preview .wd-table td{border:0;padding:6px 0}#wd-readable-preview .wd-table td:first-child{font-weight:600}#wd-readable-preview .wd-table td[data-label]:before{content:attr(data-label);display:block;color:var(--wd-muted);font-size:13px;margin-bottom:5px}}
@media(prefers-reduced-motion:reduce){#wd-readable-preview .wd-card,#wd-readable-preview .wd-progress>span{transition:none!important}}
</style>
<div class="wd-shell">
<header class="wd-top"><span class="wd-wordmark">WeDecide.</span><span class="wd-small">交互示例 · 先问喜好，再整合表格</span></header>
<nav class="wd-nav" aria-label="需求整理步骤"><button type="button" data-view="cards" aria-selected="true">1 · 说说喜好</button><button type="button" data-view="table" aria-selected="false" disabled>2 · 整合需求表</button></nav>
<section data-panel="cards" aria-label="先了解你的喜好">
  <div class="wd-row"><span class="wd-small" data-position>第 1 / 5 张</span><span class="wd-badge">先说你喜欢什么</span></div>
  <div class="wd-progress" role="progressbar" aria-label="已回答的喜好" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"><span data-progress style="width:0%"></span></div>
  <div class="wd-deck"><article class="wd-card" data-card><span class="wd-stamp" data-stamp aria-hidden="true"></span><div data-card-body></div><div class="wd-answers"><button type="button" data-answer="left"></button><button type="button" class="wd-primary" data-answer="right"></button></div><div class="wd-actions"><button type="button" data-answer="neutral">都可以</button></div></article></div>
  <div class="wd-row"><button type="button" data-back disabled>返回上一张</button><button type="button" data-answer="skip">暂时跳过</button></div>
  <div class="wd-actions"><button type="button" data-build hidden>先把已回答的喜好整理成表格</button></div>
  <p class="wd-small">左右拖动或点击回答。具体金额、时间和必要条件，可以在整理后的表格中补充。</p>
</section>
<section data-panel="table" aria-label="从喜好整合的个人需求表" hidden>
  <span class="wd-badge" data-status>由你的回答整理 · 待你核对</span>
  <h2>这些是你刚才表达的喜好。</h2>
  <p data-recap></p>
  <p class="wd-small">每一行都能直接修改。未回答项会保留未确定，喜欢的内容先作为偏好。</p>
  <form data-summary-form novalidate>
    <table class="wd-table"><thead><tr><th scope="col">项目</th><th scope="col">整理结果（可修改）</th><th scope="col">来源与用途</th></tr></thead><tbody data-rows></tbody></table>
    <div class="wd-actions"><button type="button" data-extra aria-expanded="false">补充预算、时间或必要条件（可选）</button></div>
    <div class="wd-note">喜欢自助会记录为偏好；只有你明确勾选“自助必须满足”才升级为必要条件。具体金额与时间由你补充，卡片不会替你猜。</div>
    <button type="submit" class="wd-primary">确认这份示例需求表</button>
  </form>
  <div class="wd-result" data-result role="status" aria-live="polite"></div>
</section>
</div>
<script>
(function(){
  const root=document.getElementById('wd-readable-preview');
  const find=s=>root.querySelector(s),all=s=>[...root.querySelectorAll(s)];
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const questions=[
    {id:'food',label:'饮食与活动',symbol:'食',title:'这次，一起吃顿自助，你期待吗？',text:'先说你喜欢怎样的活动，具体安排稍后再整理。',left:'更想做别的',right:'想吃自助',results:{left:'这次更想安排其他活动',right:'偏好自助餐',neutral:'饮食安排都可以'}},
    {id:'outdoor',label:'室内或户外',symbol:'游',title:'饭后去户外走走，怎么样？',text:'是想在外面逛一逛，还是待在室内更舒服？',left:'更想待在室内',right:'想去户外走走',results:{left:'更偏好室内活动',right:'偏好户外散步',neutral:'室内、户外都可以'}},
    {id:'atmosphere',label:'环境氛围',symbol:'聊',title:'安静一点、能好好聊天的地方呢？',text:'哪种氛围，会让你觉得这次聚会更舒服？',left:'热闹也不错',right:'更喜欢安静',results:{left:'热闹的氛围也不错',right:'更喜欢安静、适合聊天',neutral:'对氛围没有明显偏向'}},
    {id:'priority',label:'价格与体验',symbol:'衡',title:'价格和体验之间，你更在意哪边？',text:'先了解你的取舍。具体愿意花多少，整理表格时再填写。',left:'便宜些更好',right:'更看重体验',results:{left:'更看重省钱',right:'更看重体验',neutral:'价格与体验都看重'}},
    {id:'pace',label:'活动节奏',symbol:'缓',title:'留点时间慢慢聊，会更开心吗？',text:'你更喜欢紧凑的安排，还是轻松一些的节奏？',left:'紧凑一些也行',right:'轻松慢慢来',results:{left:'紧凑安排也可以',right:'偏好轻松、留出聊天时间',neutral:'活动节奏都可以'}}
  ];
  const emptyFields=()=>({budgetTarget:'',budgetMax:'',start:'',end:'',notes:''});
  let state={version:2,index:0,view:'cards',answers:{},sources:{},fields:emptyFields(),buffetRequired:false,showExtra:false,confirmed:false};
  function restore(snapshot){const saved=snapshot?.privateContent;if(saved?.version!==2)return;state={...state,...saved,answers:{...saved.answers},sources:{...saved.sources},fields:{...emptyFields(),...saved.fields}};state.index=Math.min(4,Math.max(0,Number(state.index)||0));state.view=['cards','table'].includes(state.view)?state.view:'cards';if(state.answers.food!=='right')state.buffetRequired=false;}
  restore(window.openai?.widgetState);
  const persist=()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'先问喜好再整合需求表',answered:Object.keys(state.answers).length,view:state.view},privateContent:state}).catch(()=>{});};
  const result=(q,value)=>q.results[value]||(value==='skip'?'暂时跳过，尚未确定':'尚未回答');
  function updateStatus(){find('[data-status]').textContent=state.confirmed?'已确认 · 仅本交互示例':'由你的回答整理 · 待你核对';find('[data-result]').textContent=state.confirmed?'示例表格已确认，未确定项保持未设置。':'';}
  function recap(){const known=questions.filter(q=>q.results[state.answers[q.id]]).map(q=>result(q,state.answers[q.id]));find('[data-recap]').textContent=known.length?'你倾向于：'+known.join('；')+'。':'还没有明确的偏好，表格会保留未确定项。';}
  function renderCard(){const q=questions[state.index];find('[data-card-body]').innerHTML=`<div class="wd-symbol" aria-hidden="true">${q.symbol}</div><h2>${q.title}</h2><p class="wd-small">${q.text}</p>`;for(const direction of ['left','right'])find(`[data-answer="${direction}"]`).textContent=direction==='left'?'← '+q.left:q.right+' →';find('[data-position]').textContent=`第 ${state.index+1} / 5 张`;find('[data-back]').disabled=state.index===0;const count=Object.keys(state.answers).length;find('[data-progress]').style.width=`${count/5*100}%`;find('[role="progressbar"]').setAttribute('aria-valuenow',String(count));find('[data-build]').hidden=count===0;find('.wd-nav [data-view="table"]').disabled=count===0;}
  const row=(label,control,source,use,extra='')=>`<tr ${extra}><td>${label}</td><td data-label="整理结果">${control}</td><td data-label="来源与用途">${source}<span class="wd-use">${use}</span></td></tr>`;
  function renderTable(){
    let rows=questions.map(q=>{const value=state.answers[q.id]||'';const options=[['','尚未回答'],['left',q.results.left],['right',q.results.right],['neutral',q.results.neutral],['skip','暂时跳过，尚未确定']];return row(q.label,`<select aria-label="${q.label}" data-preference="${q.id}">${options.map(([v,text])=>`<option value="${v}" ${v===value?'selected':''}>${text}</option>`).join('')}</select>`,`<span data-source="${q.id}">${esc(state.sources[q.id]||(value==='skip'?'已跳过':'未回答'))}</span>`,q.id==='food'?'<span data-food-use>偏好，不自动强制</span>':['atmosphere','pace'].includes(q.id)?'偏好说明，候选依据待核实':'用于表达偏好');}).join('');
    const input=(key,label,type,extra='')=>`<input type="${type}" aria-label="${label}" data-field="${key}" value="${esc(state.fields[key])}" ${extra}>`;
    const extra='data-extra-row'+(state.showExtra?'':' hidden');
    rows+=row('理想人均',input('budgetTarget','理想人均 / 元','number','min="0" max="1000000" step="0.01" placeholder="可留空，金额由你填写"'),'本人可选填写','预算偏好，不是费用上限',extra);
    rows+=row('人均上限',input('budgetMax','人均上限 / 元','number','min="0" max="1000000" step="0.01" placeholder="可留空，未设置金额限制"'),'本人可选填写','填写并确认后成为必要限制',extra);
    rows+=row('最早能参加',input('start','最早能参加','time','step="60"'),'本人可选填写','留空则未设置这个时间条件',extra);
    rows+=row('最晚需结束',input('end','最晚需结束','time','step="60"'),'本人可选填写','留空则未设置这个时间条件',extra);
    rows+=row('必要条件',`<label class="wd-check"><input type="checkbox" data-required ${state.buffetRequired?'checked':''} ${state.answers.food==='right'?'':'disabled'}><span>自助必须满足</span></label>`,'仅本人明确勾选','只有偏好自助时可主动升级为必要条件',extra);
    rows+=row('其他想法',`<textarea rows="2" maxlength="500" aria-label="其他想法" data-field="notes" placeholder="可补充表格还没表达的想法">${esc(state.fields.notes)}</textarea>`,'本人可选填写','补充说明，不自动成为必要条件',extra);
    find('[data-rows]').innerHTML=rows;find('[data-extra]').textContent=state.showExtra?'收起可选具体条件':'补充预算、时间或必要条件（可选）';find('[data-extra]').setAttribute('aria-expanded',String(state.showExtra));find('[data-food-use]').textContent=state.buffetRequired?'本人明确确认的必要条件':'偏好，不自动强制';recap();updateStatus();
  }
  function show(view){state.view=view;all('[data-panel]').forEach(el=>el.hidden=el.dataset.panel!==view);all('.wd-nav [data-view]').forEach(el=>el.setAttribute('aria-selected',String(el.dataset.view===view)));if(view==='table')renderTable();else renderCard();}
  function answer(value){const id=questions[state.index].id;state.answers[id]=value;state.sources[id]=value==='skip'?'卡片中跳过':'卡片回答';if(id==='food'&&value!=='right')state.buffetRequired=false;state.confirmed=false;if(state.index<4){state.index++;renderCard();}else{renderCard();show('table');}persist();}
  root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.dataset.view){show(button.dataset.view);persist();}else if(button.dataset.answer)answer(button.dataset.answer);else if(button.hasAttribute('data-back')){state.index=Math.max(0,state.index-1);renderCard();persist();}else if(button.hasAttribute('data-build')){show('table');persist();}else if(button.hasAttribute('data-extra')){state.showExtra=!state.showExtra;all('[data-extra-row]').forEach(el=>el.hidden=!state.showExtra);button.setAttribute('aria-expanded',String(state.showExtra));button.textContent=state.showExtra?'收起可选具体条件':'补充预算、时间或必要条件（可选）';persist();}});
  root.addEventListener('input',event=>{const key=event.target.dataset.field;if(!key)return;state.fields[key]=event.target.value;state.confirmed=false;updateStatus();persist();});
  root.addEventListener('change',event=>{const key=event.target.dataset.preference;if(key){state.answers[key]=event.target.value;if(!state.answers[key])delete state.answers[key];state.sources[key]='表格修改';find(`[data-source="${key}"]`).textContent='表格修改';if(key==='food'){const input=find('[data-required]');input.disabled=state.answers.food!=='right';if(input.disabled)state.buffetRequired=input.checked=false;find('[data-food-use]').textContent=state.buffetRequired?'本人明确确认的必要条件':'偏好，不自动强制';}state.confirmed=false;recap();updateStatus();persist();}else if(event.target.hasAttribute('data-required')){state.buffetRequired=event.target.checked;state.confirmed=false;find('[data-food-use]').textContent=state.buffetRequired?'本人明确确认的必要条件':'偏好，不自动强制';updateStatus();persist();}});
  find('[data-summary-form]').addEventListener('submit',event=>{event.preventDefault();const inputs=all('input[data-field]');const bad=inputs.find(input=>!input.checkValidity());if(bad){find('[data-result]').textContent='请核对填写的金额或时间。金额为非负数，最多两位小数。';state.showExtra=true;all('[data-extra-row]').forEach(el=>el.hidden=false);bad.focus();return;}const f=state.fields;if(f.budgetTarget!==''&&f.budgetMax!==''&&Number(f.budgetTarget)>Number(f.budgetMax)){find('[data-result]').textContent='理想人均应不高于人均上限，请核对。';return;}if(f.start&&f.end&&f.end<=f.start){find('[data-result]').textContent='最晚结束时间应晚于最早参加时间。';return;}state.confirmed=true;updateStatus();persist();});
  const card=find('[data-card]'),stamp=find('[data-stamp]');let drag=null;
  const reset=()=>{card.style.transform='';card.classList.remove('wd-dragging');stamp.style.opacity='0';};
  card.addEventListener('pointerdown',event=>{if(event.button!==0||event.target.closest('button,input,textarea,label,select'))return;drag={id:event.pointerId,x:event.clientX,y:event.clientY,dx:0,dy:0};card.setPointerCapture(event.pointerId);});
  card.addEventListener('pointermove',event=>{if(!drag||drag.id!==event.pointerId)return;drag.dx=event.clientX-drag.x;drag.dy=event.clientY-drag.y;if(Math.abs(drag.dx)<12||Math.abs(drag.dx)<Math.abs(drag.dy)*1.3)return;const dx=Math.max(-100,Math.min(100,drag.dx));card.classList.add('wd-dragging');card.style.transform=`translateX(${dx}px) rotate(${dx/15}deg)`;stamp.textContent=questions[state.index][dx>0?'right':'left'];stamp.style.opacity=String(Math.min(1,Math.abs(dx)/55));});
  card.addEventListener('pointerup',event=>{if(!drag||drag.id!==event.pointerId)return;const value=Math.abs(drag.dx)>70&&Math.abs(drag.dx)>Math.abs(drag.dy)*1.3?(drag.dx>0?'right':'left'):null;drag=null;reset();if(value)answer(value);});
  card.addEventListener('pointercancel',()=>{drag=null;reset();});
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);renderCard();show(state.view);}});
  renderCard();show(state.view);
})();
</script>
</div>
